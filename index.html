/* Video picture-in-picture. Inside the claude.ai frame the browser refuses both the
   Document PiP window and pop-ups, but it does allow a <video> to float. So the timer is
   drawn onto a canvas, streamed into a muted video, and that video goes PiP. The PiP
   window's play/pause and next-track buttons drive the timer through Media Session.
   A worker keeps redrawing it while this tab is in the background (plain timers there
   get slowed to once a minute). */
let vpip = null;   // {cv, g, video, worker, timer}
function vpipInit(){
  if(vpip) return vpip;
  const cv = document.createElement("canvas"); cv.width = 480; cv.height = 270;
  if(!cv.captureStream) return null;
  const video = document.createElement("video");
  video.muted = true; video.playsInline = true; video.autoplay = true;
  video.setAttribute("aria-hidden","true");
  video.style.cssText = "position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0;pointer-events:none";
  video.srcObject = cv.captureStream(4);
  document.body.appendChild(video);
  vpip = {cv:cv, g:cv.getContext("2d"), video:video, worker:null, timer:null};
  vpipDraw();
  video.play().catch(function(){});
  video.addEventListener("leavepictureinpicture", function(){ vpipStopTicking(); $("#btnPip").setAttribute("aria-pressed","false"); });
  return vpip;
}
function vpipDraw(){
  if(!vpip) return;
  const th = theme(), g = vpip.g, W = vpip.cv.width, H = vpip.cv.height;
  const val = T.mode === "stopwatch" ? fmt(elapsedSw()) : fmt(leftNow());
  const tot = totalMs();
  const pct = T.mode === "stopwatch" ? 0 : (tot ? Math.max(0, Math.min(1, 1 - leftNow()/tot)) : 0);
  g.fillStyle = th.solid; g.fillRect(0, 0, W, H);
  g.fillStyle = th.text; g.textAlign = "center"; g.textBaseline = "middle";
  const fam = (FONTS[S.settings.font] || FONTS.sans).family;
  g.font = "800 "+(val.length > 5 ? 92 : 118)+"px "+fam;
  g.fillText(val, W/2, H/2 - 10);
  g.globalAlpha = .7; g.font = "600 20px "+fam;
  g.fillText((phaseLabel() + (T.running ? "" : " · paused")).toUpperCase(), W/2, H/2 + 72);
  g.globalAlpha = .18; g.fillRect(40, H - 26, W - 80, 6);
  g.globalAlpha = 1; g.fillStyle = th.accent; g.fillRect(40, H - 26, (W - 80)*pct, 6);
  if("mediaSession" in navigator){
    try{ navigator.mediaSession.playbackState = T.running ? "playing" : "paused"; }catch(e){}
  }
}
function vpipStartTicking(){
  vpipStopTicking();
  try{
    const src = "setInterval(function(){postMessage(0)},500)";
    vpip.worker = new Worker(URL.createObjectURL(new Blob([src], {type:"text/javascript"})));
    vpip.worker.onmessage = vpipDraw;
  }catch(e){ vpip.worker = null; }
  if(!vpip.worker) vpip.timer = setInterval(vpipDraw, 500);
}
function vpipStopTicking(){
  if(!vpip) return;
  if(vpip.worker){ vpip.worker.terminate(); vpip.worker = null; }
  if(vpip.timer){ clearInterval(vpip.timer); vpip.timer = null; }
}
function vpipMediaKeys(){
  if(!("mediaSession" in navigator)) return;
  const set = function(a, fn){ try{ navigator.mediaSession.setActionHandler(a, fn); }catch(e){} };
  set("play", function(){ start(); vpipDraw(); });
  set("pause", function(){ pause(); vpipDraw(); });
  set("nexttrack", function(){ skip(); vpipDraw(); });
  try{ navigator.mediaSession.metadata = new MediaMetadata({title:"Focus Study", artist:phaseLabel()}); }catch(e){}
}
async function openVideoPip(){
  const v = vpipInit();
  if(!v || !document.pictureInPictureEnabled) return false;
  vpipDraw();
  try{ await v.video.play(); }catch(e){}
  await v.video.requestPictureInPicture();
  vpipMediaKeys();
  vpipStartTicking();
  $("#btnPip").setAttribute("aria-pressed","true");
  return true;
}
function inFrame(){ try{ return window.self !== window.top; }catch(e){ return true; } }

async function togglePip(){
  if(pipWin){ closePip(); return; }
  if(document.pictureInPictureElement){
    try{ await document.exitPictureInPicture(); }catch(e){}
    vpipStopTicking(); $("#btnPip").setAttribute("aria-pressed","false"); return;
  }
  // Framed (like on claude.ai): the video route is the one the browser allows, so go
  // straight to it while the click still counts as a user gesture.
  if(inFrame() || !window.documentPictureInPicture){
    try{ if(await openVideoPip()) return; }catch(e){}
  }
  try{
    const w = await openPipWindow();
    if(!w){
      try{ if(await openVideoPip()) return; }catch(e){}
      toast("Your browser won't float the timer from this page. Chrome, Edge and Safari support it.", 4000);
      return;
    }
    pipWin = w; pipDoc = w.document;
    pipDoc.head.innerHTML = '<meta charset="utf-8"><title>Focus Study</title>';
    // the floating window starts empty, so bring the web fonts across or it would fall back to a system font
    Array.prototype.forEach.call(document.querySelectorAll('link[rel="stylesheet"]'), function(l){
      pipDoc.head.appendChild(l.cloneNode(true));
    });
    const st = pipDoc.createElement("style"); st.id = "pipcss"; pipDoc.head.appendChild(st);
    pipDoc.body.innerHTML = '<div id="t">00:00</div><div id="l"></div>'+
      '<div id="r"><button id="b">Start</button><button id="k" class="g" title="Skip" aria-label="Skip">Skip</button></div>';
    pipDoc.getElementById("b").addEventListener("click", function(){ toggle(); paintPip(); });
    pipDoc.getElementById("k").addEventListener("click", function(){ skip(); paintPip(); });
    pipDoc.addEventListener("keydown", function(e){
      if(e.code === "Space"){ e.preventDefault(); toggle(); paintPip(); }
    });
    w.addEventListener("pagehide", function(){
      if(pipWin === w){ if(pipTimer){ clearInterval(pipTimer); pipTimer = null; } pipWin = null; pipDoc = null; pipSig = "";
        $("#btnPip").setAttribute("aria-pressed","false"); }
    });
    pipTimer = setInterval(paintPip, 500);    // main-tab timers get throttled in the background; this one doesn't
    $("#btnPip").setAttribute("aria-pressed","true");
    paintPip();
  }catch(e){
    closePip();
    toast("Couldn't open the floating timer here.", 3000);
  }
}

/* one delegated handler for everything inside the panel */
$("#panelBody").addEventListener("click", function(e){
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, k = el.dataset.k, id = el.dataset.id;

  if(act === "addTask"){
    const name = ($("#taskName").value||"").trim();
    if(!name) return;
    const est = Math.max(1, Math.min(30, parseInt($("#taskEst").value,10)||1));
    const t = {id:"t"+Date.now(), name:name, estimate:est, pomos:0, done:false};
    S.tasks.push(t);
    if(!S.activeTaskId) S.activeTaskId = t.id;
    render();
  }
  else if(act === "doneTask"){
    S.tasks.forEach(function(t){ if(t.id===id) t.done = !t.done; }); render();
  }
  else if(act === "pickTask"){ S.activeTaskId = S.activeTaskId === id ? null : id; render(); }
  else if(act === "delTask"){
    S.tasks = S.tasks.filter(function(t){ return t.id !== id; });
    if(S.activeTaskId === id) S.activeTaskId = null;
    render();
  }
  else if(act === "runRoutine"){
    const r = S.routines.filter(function(x){ return x.id===id; })[0]; if(!r) return;
    if(r.mode === "plan"){
      const total = r.planTotal || 100;
      const ro = {blocks:r.planBlocks||0, longAt:r.planLongAt===undefined?"auto":r.planLongAt};
      S.plan = {steps:buildPlan(total, r.planBreaks !== false, !!r.planEven, ro) || buildPlan(total, r.planBreaks !== false, !!r.planEven), index:0,
        total:total, includeBreaks:r.planBreaks !== false, even:!!r.planEven, blocks:ro.blocks, longAt:ro.longAt};
      S.planForm.h = Math.floor(total/60); S.planForm.m = total%60;
      startPlan(); closePanel(); start(); toast(r.name+" started"); return;
    }
    if(r.mode === "custom") S.settings.custom = r.custom || 30;
    else if(r.mode === "animedoro"){ S.settings.animeWork = r.work||40; S.settings.animeBreak = r.short||20; }
    else if(r.mode === "pomodoro"){
      S.settings.work = r.work||25; S.settings.short = r.short||5;
      S.settings.long = r.long||15; S.settings.before = r.before||4;
    }
    setMode(r.mode);
    closePanel(); start();
    toast(r.name+" started");
  }
  else if(act === "saveRoutine"){
    const nm = ($("#routineName").value||"").trim();
    if(!nm){ toast("Give the routine a name"); return; }
    const s = S.settings;
    S.routines.push({id:"r"+Date.now(), name:nm, mode:T.mode, at:$("#routineAt").value||"",
      work:T.mode==="animedoro"?s.animeWork:s.work, short:T.mode==="animedoro"?s.animeBreak:s.short,
      long:s.long, before:s.before, custom:s.custom,
      planTotal:S.planForm.h*60+S.planForm.m, planBreaks:S.planForm.includeBreaks, planEven:S.planForm.even,
      planBlocks:S.planForm.blocks||0, planLongAt:S.planForm.longAt===undefined?"auto":(Array.isArray(S.planForm.longAt)?S.planForm.longAt.slice():S.planForm.longAt)});
    render(); toast("Routine saved");
  }
  else if(act === "svc"){ S.music.service = k; render(); }
  else if(act === "saveMusic"){
    S.music.links[S.music.service] = ($("#musicLink").value||"").trim();
    render(); watchFrame();
    toast(embedUrl(S.music.service, S.music.links[S.music.service]) ? "Link saved" : "Saved, but that link looks off");
  }
  else if(act === "openMusic"){
    const link = ($("#musicLink") && $("#musicLink").value.trim()) || S.music.links[S.music.service];
    if(!link){ toast("Paste a link first"); return; }
    window.open(link, "_blank", "noopener");
  }
  else if(act === "sound"){
    S.settings.sound = k; S.settings.soundOn = true;
    if(!startNoise()) { S.settings.soundOn = false; toast("Audio isn't available here"); }
    render();
  }
  else if(act === "toggleSound"){
    S.settings.soundOn = !S.settings.soundOn;
    if(S.settings.soundOn){ if(!startNoise()){ S.settings.soundOn = false; toast("Audio isn't available here"); } }
    else stopNoise();
    render();
  }
  else if(act === "toggleChime"){ S.settings.chime = !S.settings.chime; render(); }
  else if(act === "autoBreaks"){
    S.settings.autoBreaks = !S.settings.autoBreaks;
    if(!T.running && T.mode !== "plan") T.leftMs = totalMs();
    if(T.mode === "plan") autoRebuild();
    render();
  }
  else if(act === "toggleAuto"){ S.settings.autoStart = !S.settings.autoStart; render(); }
  else if(act === "mode"){ setMode(k); }
  else if(act === "planPreset"){
    S.planForm.h = parseInt(el.dataset.h,10); S.planForm.m = parseInt(el.dataset.m,10);
    planFormChanged();
  }
  else if(act === "planBreaks"){ S.planForm.includeBreaks = !S.planForm.includeBreaks; planFormChanged(); }
  else if(act === "longMode"){
    if(k === "custom"){
      // start Custom from what Auto would do, so the picks make sense straight away
      if(!longList(S.planForm.longAt)){
        const f = S.planForm, ap = buildPlan(Math.max(5, f.h*60+f.m), f.includeBreaks, f.even, {blocks:f.blocks, longAt:"auto"});
        const spots = []; let c = 0;
        (ap||[]).forEach(function(x){ if(x.type === "focus") c++; else if(x.type === "long") spots.push(c); });
        S.planForm.longAt = spots;
      }
    } else S.planForm.longAt = k;
    planFormChanged();
  }
  else if(act === "longAfter"){
    const n = el.dataset.n === "end" ? "end" : parseInt(el.dataset.n,10), cur = (longList(S.planForm.longAt) || []).slice();
    const i = cur.indexOf(n);
    if(i >= 0) cur.splice(i,1); else cur.push(n);
    S.planForm.longAt = sortPicks(cur);
    planFormChanged();
  }
  else if(act === "planEven"){ S.planForm.even = !S.planForm.even; planFormChanged(); }
  else if(act === "planBuild"){
    const f = S.planForm, total = f.h*60 + f.m;
    if(total < 5){ toast("Give it at least 5 minutes"); return; }
    const steps = buildPlan(total, f.includeBreaks, f.even, {blocks:f.blocks, longAt:f.longAt});
    if(!steps){ toast("That many blocks won't fit — try fewer blocks or more time"); return; }
    S.plan = {steps:steps, index:0, total:total, includeBreaks:f.includeBreaks, even:f.even, blocks:f.blocks, longAt:f.longAt};
    const focusMin = steps.reduce(function(a,x){ return a + (x.type==="focus"?x.min:0); }, 0);
    if(T.mode !== "plan") setMode("plan"); else { T.running = false; releaseWakeLock(); T.phase = steps[0].type; T.leftMs = totalMs(); }
    render();
    toast(planBlockTotal()+" blocks · "+focusMin+" min of focus");
  }
  else if(act === "planStart"){
    if(!planSteps().length) return;
    startPlan(); closePanel(); start();
  }
  else if(act === "planClear"){
    S.plan = null; T.leftMs = totalMs(); render(); toast("Plan cleared");
  }
  else if(act === "font"){ S.settings.font = k; applyFont(); buildFace(); render(); }
  else if(act === "theme"){
    S.theme = k;
    const th = allThemes()[k];
    if(th && th.form) S.themeForm = Object.assign({}, th.form);
    applyScene(true); render();
  }
  else if(act === "themeTab"){ themeTab = k; renderPanel(); }
  else if(act === "face"){ S.settings.face = k; buildFace(); render(); }
  else if(act === "tfStyle"){ S.themeForm.style = k; renderPanel(); save(); }
  else if(act === "tfLight"){ S.themeForm.light = !S.themeForm.light; renderPanel(); save(); }
  else if(act === "tfSave"){
    const nameEl = document.getElementById("tfName");
    const nm = ((nameEl && nameEl.value) || "").trim();
    if(!nm){ toast("Give your theme a name"); return; }
    S.themeForm.name = nm;
    const id = "my_"+nm.toLowerCase().replace(/[^a-z0-9]+/g,"_").slice(0,24)+"_"+Date.now().toString(36).slice(-4);
    S.customThemes[id] = makeTheme(S.themeForm);
    S.theme = id;
    themeTab = "packs";
    applyScene(true); render();
    toast('"'+nm+'" saved to your themes');
  }
  else if(act === "delTheme"){
    const wasActive = S.theme === k;
    delete S.customThemes[k];
    if(wasActive) S.theme = "auraTwilight";
    applyScene(true); render(); toast("Theme deleted");
  }
  else if(act === "scene"){ S.scene = k; applyScene(true); render(); }
  else if(act === "clearBg"){ S.bgImage = null; applyScene(true); render(); toast("Picture removed"); }
  else if(act === "range"){ statRange = parseInt(k,10); renderPanel(); }
  else if(act === "exportData"){ exportData(); }
  else if(act === "sbSave"){
    const url = ($("#sbUrl").value||"").trim().replace(/\/+$/,"");
    const key = ($("#sbKey").value||"").trim();
    if(!/^https:\/\/.+\..+/.test(url)){ toast("That doesn't look like a project URL"); return; }
    if(key.length < 30){ toast("That anon key looks too short"); return; }
    try{ localStorage.setItem(CLOUD_KEY, JSON.stringify({url:url, anonKey:key})); }
    catch(e){ toast("Couldn't save those settings"); return; }
    cloudErr = null;
    initCloud().then(function(){ renderPanel(); });
    toast("Connected. Sign up or log in below.");
  }
  else if(act === "sbForget"){
    try{ localStorage.removeItem(CLOUD_KEY); }catch(e){}
    sb = null; me = null; cloudErr = null; renderPanel();
    toast("Project disconnected");
  }
  else if(act === "showSql"){
    const box = document.getElementById("sqlBox"); if(!box) return;
    box.hidden = false;
    box.innerHTML = '<textarea class="txt" id="sqlText" rows="9" readonly '+
      'style="font-family:\'DM Mono\',monospace;font-size:10.5px;resize:vertical">'+esc(SETUP_SQL)+'</textarea>'+
      '<button class="solid" id="sqlCopy" style="width:100%;margin-top:8px">Copy the SQL</button>';
    document.getElementById("sqlCopy").addEventListener("click", function(){

      if(navigator.clipboard && navigator.clipboard.writeText){

/* Background picture: scaled down on a canvas before it is stored, so a 4MB
   phone photo doesn't blow the browser's storage budget. */
$("#panelBody").addEventListener("change", function(e){
  if(e.target.dataset && (e.target.dataset.act === "planBlocks" || e.target.dataset.act === "planH" || e.target.dataset.act === "planM")){ planFormChanged(); return; }
  if(e.target.dataset && e.target.dataset.act === "num"){ renderPanel(); return; }
  if(e.target.id !== "bgFile") return;
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast("That isn't an image file"); return; }
  const reader = new FileReader();
  reader.onload = function(){
    const im = new Image();
    im.onload = function(){
      try{
        const max = 1600;
        const scale = Math.min(1, max/Math.max(im.width, im.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width*scale); cv.height = Math.round(im.height*scale);
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
        S.bgImage = cv.toDataURL("image/jpeg", 0.82);
        if(S.scene === "none" && !SCENES[S.scene]) S.scene = "none";
        applyScene(true); render();
        try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); toast("Background set"); }
        catch(err){
          S.bgImage = null; applyScene(true); render();
          toast("That image is too large for this browser's storage. Try a smaller one.", 4000);
        }
      }catch(err){ toast("Couldn't read that image"); }
    };
    im.onerror = function(){ toast("Couldn't read that image"); };
    im.src = reader.result;
  };
  reader.onerror = function(){ toast("Couldn't read that file"); };
  reader.readAsDataURL(file);
});

function watchFrame(){
  clearTimeout(frameTimer);
  const f = document.getElementById("musicFrame");
  if(!f) return;
  let ok = false;
  f.addEventListener("load", function(){ ok = true; });
  frameTimer = setTimeout(function(){
    if(ok) return;
    const wrap = document.getElementById("frameWrap"), fb = document.getElementById("frameFallback");
    if(wrap && fb){ wrap.hidden = true; fb.hidden = false; }
  }, 2800);
}

/* Saving a file is blocked inside the artifact frame, so the export shows the
   JSON for you to copy instead of handing you a dead download link. */
function exportData(){
  const box = document.getElementById("exportBox"); if(!box) return;

  box.hidden = false;
  box.innerHTML = '<textarea class="txt" id="exportText" rows="7" readonly '+

  const ta = document.getElementById("exportText");
  document.getElementById("exportCopy").addEventListener("click", function(){
    const done = function(){ toast("Copied"); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(done).catch(function(){ ta.select(); toast("Selected — press Ctrl/Cmd+C"); });
    } else { ta.select(); toast("Selected — press Ctrl/Cmd+C"); }
  });
}
