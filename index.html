<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Focus Study (Copy)</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Quicksand:wght@600;700&family=Archivo+Narrow:wght@600;700&family=Lexend:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@500;600;700;800&family=Lora:wght@500;600;700&display=swap">
<style>
/* Layout: single full-height workspace. Centred timer column, two icon docks pinned
   bottom-left / bottom-right, one slide-in panel from the left for everything else.
   Palette is theme-driven: every colour below reads from a token that JS rewrites
   when the user picks a theme, so the app owns its own light/dark world. */
:root{
  --bg:#4527a0; --solid:#5b2a9e; --text:#fff; --sub:rgba(255,255,255,.62);
  --card:rgba(255,255,255,.12); --border:rgba(255,255,255,.2);
  --accent:#6d28d9; --onAccent:#fff;
  --panel:rgba(12,12,16,.9); --panelText:#fff;
  --ui:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --timerFont:var(--ui);
  --good:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--ui);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{position:relative;height:100%;width:100%;display:flex;flex-direction:column;
  background:var(--bg);transition:background .6s ease;overflow:hidden}
#app.anim{background-size:300% 300%;animation:drift 18s ease infinite}
@keyframes drift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:17px}
.brand span.light{font-weight:400;opacity:.6}
.quote{font-size:13px;line-height:1.4;opacity:.75;max-width:46%;text-align:right;font-style:italic}
@media(max-width:640px){.quote{display:none}}

/* ---------- centre ---------- */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:8px 16px 96px;min-height:0;overflow-y:auto;z-index:4}
.prompt{font-size:clamp(20px,4vw,28px);font-weight:700;text-align:center;text-wrap:balance;margin:0}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:min(92vw,420px);
  padding:7px 15px;border-radius:999px;background:var(--card);border:1px solid var(--border);
  font-size:13.5px;transition:transform .2s}
.chip:hover{transform:translateY(-1px)}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ct{color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--border);flex-wrap:wrap;justify-content:center}
.tabs button{padding:7px 15px;border-radius:999px;font-size:13px;font-weight:600;transition:.2s}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--onAccent)}
.hearts{display:flex;gap:6px;min-height:18px}
.strip{display:flex;gap:3px;width:min(440px,78vw);height:9px}
.strip .seg{border-radius:3px;background:var(--card);border:1px solid transparent}
.strip .seg.focus{background:color-mix(in srgb, var(--accent) 45%, transparent)}
.strip .seg.focus.past{background:var(--accent)}
.strip .seg.focus.now{background:var(--accent);box-shadow:0 0 0 2px var(--border)}
.strip .seg.short,.strip .seg.long{background:var(--card);border-color:var(--border)}
.strip .seg.now{outline:1px solid var(--text);outline-offset:1px}
.planline{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
/* ---------- timer faces ---------- */
.face{display:flex;align-items:center;justify-content:center;width:100%;max-width:100%}
.f-digital{font-family:var(--timerFont);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
  text-align:center;max-width:100%;overflow:hidden}

/* flip clock */
.f-flip{display:flex;align-items:center;gap:6px;font-family:var(--timerFont);font-variant-numeric:tabular-nums}
.f-flip .sep{font-weight:700;opacity:.45;padding:0 1px}
.f-card{position:relative;display:grid;place-items:center;border-radius:11px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--solid) 70%, #000 12%) 0 50%, color-mix(in srgb, var(--solid) 86%, #000 26%) 50% 100%);
  border:1px solid var(--border);box-shadow:0 6px 18px rgba(0,0,0,.28);font-weight:800;line-height:1;overflow:hidden}
.f-card::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.35)}
.f-card.turn{animation:flip .42s ease}
@keyframes flip{0%{transform:perspective(320px) rotateX(0)}45%{transform:perspective(320px) rotateX(-32deg)}100%{transform:perspective(320px) rotateX(0)}}

/* ring + analog share the svg box */
.f-svg{display:block;max-width:100%;height:auto}

/* minimal progress line */
.f-line{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(520px,84vw)}
.f-line .lt{font-family:var(--timerFont);font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.f-line .track{position:relative;width:100%;height:1px;background:var(--border)}
.f-line .fill{position:absolute;inset:0 auto 0 0;height:1px;background:var(--text);width:0;transition:width .3s linear}
.f-line .dot{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent);transition:left .3s linear}
.f-line .ends{display:flex;justify-content:space-between;width:100%;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--sub)}

/* ---------- scenes ---------- */
#bgimg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;display:none}
#bgimg.on{display:block}
#scene{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
#scene svg{position:absolute;inset:0;width:100%;height:100%}
.veil{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.12) 45%,rgba(0,0,0,.42))}
.veil.light{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1) 45%,rgba(255,255,255,.45))}
.petal{position:absolute;top:-6%;border-radius:76% 24% 70% 30%/ 30% 70% 30% 70%;
  background:linear-gradient(135deg,#ffd9e8,#ff9ec4);opacity:.85;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translate3d(0,-10vh,0) rotate(0deg)}
  100%{transform:translate3d(14vw,112vh,0) rotate(540deg)}
}
.drop{position:absolute;top:-14%;width:1.5px;background:linear-gradient(transparent,rgba(214,235,255,.75));
  animation:rain linear infinite}
@keyframes rain{0%{transform:translate3d(0,-18vh,0)}100%{transform:translate3d(-7vw,116vh,0)}}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.95;transform:scale(1.25)}}
.shoot{position:absolute;width:120px;height:1.5px;background:linear-gradient(90deg,transparent,#fff);
  opacity:0;animation:shoot 9s linear infinite}
@keyframes shoot{0%{opacity:0;transform:translate3d(0,0,0) rotate(18deg)}
  4%{opacity:.9}14%{opacity:0;transform:translate3d(46vw,20vh,0) rotate(18deg)}100%{opacity:0}}
.ribbon{position:absolute;left:-20%;width:140%;height:34vh;filter:blur(42px);opacity:.5;
  border-radius:50%;animation:wave ease-in-out infinite alternate}
@keyframes wave{0%{transform:translate3d(-6%,0,0) scaleY(.8)}100%{transform:translate3d(6%,5vh,0) scaleY(1.25)}}
.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe9a8;
  box-shadow:0 0 9px 3px rgba(255,220,130,.6);animation:float ease-in-out infinite alternate}
@keyframes float{0%{transform:translate3d(0,0,0);opacity:.25}100%{transform:translate3d(5vw,-7vh,0);opacity:.95}}
.bar{width:min(440px,78vw);height:4px;border-radius:99px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s linear}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.rnd{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--border);
  display:grid;place-items:center;transition:transform .15s}
.rnd:hover{transform:scale(1.07)}
.rnd[aria-pressed="true"]{background:var(--accent);color:var(--onAccent)}
.go{display:inline-flex;align-items:center;gap:9px;padding:14px 38px;border-radius:999px;
  background:var(--accent);color:var(--onAccent);font-weight:700;font-size:17px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .15s}
.go:hover{transform:scale(1.04)}
.hint{font-size:11.5px;color:var(--sub);letter-spacing:.04em}

/* ---------- docks ---------- */
.dock{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:6;flex-wrap:wrap}
.dock.l{left:18px}
.dock.r{right:18px;justify-content:flex-end}
.dockbtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--border);
  display:grid;place-items:center;transition:transform .15s}
.dockbtn:hover{transform:translateY(-2px)}
.dockbtn[aria-pressed="true"]{background:var(--accent);color:var(--onAccent)}
.streak{height:40px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
@media(max-width:560px){
  .dock{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .dock.l{left:12px}.dock.r{right:12px}
  .streak{display:none}
}

/* ---------- panel ---------- */
#panel{position:absolute;inset:0 auto 0 0;width:min(100%,380px);z-index:30;
  background:var(--panel);color:var(--panelText);border-right:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(16px);transform:translateX(-102%);transition:transform .32s ease;
  overflow-y:auto;overscroll-behavior:contain;
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px))}
#panel.open{transform:none}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.phead h2{margin:0;flex:1;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sect{margin-bottom:22px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.45);margin:0 0 9px}
.box{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row+.row{margin-top:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.num{width:66px;text-align:center;border-radius:9px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.12);padding:6px;font-variant-numeric:tabular-nums}
.txt{width:100%;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  padding:9px 11px;font-size:13.5px;outline:none}
.txt::placeholder{color:rgba(255,255,255,.35)}
.pill{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);font-size:12.5px;font-weight:600;text-align:center;transition:.15s}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--onAccent);border-color:transparent}
.solid{background:var(--accent);color:var(--onAccent);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px}
.ghost{border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600}
.note{font-size:11.5px;line-height:1.55;color:rgba(255,255,255,.5);margin:8px 0 0}
input[type=range]{accent-color:var(--accent);width:100%}
.swatch{border-radius:12px;overflow:hidden;border:2px solid transparent;transition:.15s}
.swatch[aria-pressed="true"]{border-color:#fff}
.swatch .sw{height:62px}
.swatch .nm{font-size:11.5px;font-weight:600;padding:6px 8px;text-align:left;background:rgba(0,0,0,.35)}
.task{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1)}
.task+.task{margin-top:8px}
.task.done{opacity:.45}
.task .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .nm.strike{text-decoration:line-through}
.task .sub{font-size:11px;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums}
.stat{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.45)}
.stat .v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px}
.mini{font-size:11px;color:rgba(255,255,255,.45)}
.ic{flex:none;display:block}
.sp{flex:1;min-width:0}
.scorewrap{display:flex;align-items:center;gap:14px}
.ring{flex:none}
.routine{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);width:100%;text-align:left}
.routine+.routine{margin-top:8px}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 7px;border-radius:999px;background:var(--accent);color:var(--onAccent)}
.frame{border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25)}
.frame iframe{display:block;width:100%;border:0}
input[type=color]{width:38px;height:30px;padding:0;border:1px solid rgba(255,255,255,.2);
  border-radius:8px;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}
.seg2{display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.seg2 button{flex:1;padding:7px 4px;border-radius:999px;font-size:12px;font-weight:600}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--onAccent)}
.previewSw{height:84px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
  display:grid;place-items:center;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.scenebtn{border-radius:12px;overflow:hidden;border:2px solid transparent;transition:.15s;text-align:left}
.scenebtn[aria-pressed="true"]{border-color:#fff}
.scenebtn .thumb{height:54px;position:relative;overflow:hidden}
.scenebtn .nm{font-size:11.5px;font-weight:600;padding:6px 8px;background:rgba(0,0,0,.35)}
.delx{opacity:.55;padding:4px}
.delx:hover{opacity:1}

/* ---------- toast ---------- */
#toast{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-18px);
  background:rgba(10,10,14,.9);color:#fff;border:1px solid rgba(255,255,255,.16);
  padding:9px 17px;border-radius:999px;font-size:13px;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- shield overlay ---------- */
#shield{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);text-align:center;padding:24px}
#shield.on{display:flex}
#shield .big{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
</style>

<div id="app">
  <div id="bgimg" aria-hidden="true"></div>
  <div id="scene" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <div class="topbar">
    <div class="brand"><span id="brandIcon"></span>focus<span class="light">study</span></div>
    <p class="quote" id="quote"></p>
  </div>

  <div class="stage">
    <h1 class="prompt" id="prompt">What do you want to focus on?</h1>

    <button class="chip" id="taskChip"></button>

    <div class="tabs" id="phaseTabs"></div>
    <div class="hearts" id="hearts"></div>

    <div class="face" id="face"></div>
    <div class="bar" id="bar"><i id="barFill"></i></div>

    <div class="controls">
      <button class="rnd" id="btnReset" title="Reset (R)" aria-label="Reset"></button>
      <button class="go" id="btnGo"></button>
      <button class="rnd" id="btnSkip" title="Skip (S)" aria-label="Skip phase"></button>
      <button class="rnd" id="btnPip" title="Floating timer" aria-label="Floating timer" aria-pressed="false"></button>
      <button class="rnd" id="btnShield" title="Focus shield" aria-label="Focus shield" aria-pressed="false"></button>
    </div>
    <p class="hint" id="hint">Space start / pause · R reset · S skip</p>
  </div>

  <div class="dock l">
    <button class="dockbtn" data-panel="tasks" title="Tasks" aria-label="Tasks"></button>
    <button class="dockbtn" data-panel="routines" title="Routines" aria-label="Routines"></button>
    <button class="dockbtn" data-panel="music" title="Music" aria-label="Music"></button>
    <button class="dockbtn" data-panel="timer" title="Timer settings" aria-label="Timer settings"></button>
  </div>

  <div class="dock r">
    <div class="streak" id="streak"></div>
    <button class="dockbtn" data-panel="account" title="Account" aria-label="Account"></button>
    <button class="dockbtn" data-panel="stats" title="Statistics" aria-label="Statistics"></button>
    <button class="dockbtn" data-panel="sounds" title="Ambient sound" aria-label="Ambient sound"></button>
    <button class="dockbtn" data-panel="themes" title="Themes" aria-label="Themes"></button>
  </div>

  <div id="shield">
    <div class="big" id="shieldTitle">Focus shield on</div>
    <div id="shieldBody" style="font-size:13px;opacity:.75;max-width:320px;line-height:1.5"></div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="solid" id="shieldResume">Back in</button>
      <button class="ghost" id="shieldOff">End shield</button>
    </div>
  </div>

  <aside id="panel" aria-hidden="true">
    <div class="phead">
      <h2 id="panelTitle"></h2>
      <button class="dockbtn" id="panelClose" aria-label="Close panel" style="width:34px;height:34px"></button>
    </div>
    <div id="panelBody"></div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";

/* ===================================================================
   CLOUD ACCOUNTS — paste your two Supabase keys here, or enter them in
   the app under Account. Both are safe to ship in the page: the anon
   key is designed to be public and row-level security is what actually
   protects the data. Never put the service_role key in this file.
   =================================================================== */
const SUPABASE_URL = "";       // e.g. https://abcdefgh.supabase.co
const SUPABASE_ANON_KEY = "";  // the "anon public" key from Settings → API
/* ============================ icons ============================ */
const P = {
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',

  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function load(){
  const base = clone(DEFAULTS);
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      base.settings = Object.assign(base.settings, d.settings||{});
      if(Array.isArray(d.tasks)) base.tasks = d.tasks;
      if(Array.isArray(d.sessions)) base.sessions = d.sessions;
      if(Array.isArray(d.routines) && d.routines.length) base.routines = d.routines;
      if(d.customThemes && typeof d.customThemes === "object") base.customThemes = d.customThemes;
      if(d.theme && (THEMES[d.theme] || base.customThemes[d.theme])) base.theme = d.theme;
      if(d.scene && SCENES[d.scene]) base.scene = d.scene;
      if(typeof d.bgImage === "string") base.bgImage = d.bgImage;
      if(d.themeForm) base.themeForm = Object.assign(base.themeForm, d.themeForm);
      if(d.music) base.music = Object.assign(base.music, d.music);
      if(d.plan && Array.isArray(d.plan.steps) && d.plan.steps.length) base.plan = d.plan;
      if(d.planForm) base.planForm = Object.assign(base.planForm, d.planForm);
      if(d.activeTaskId !== undefined) base.activeTaskId = d.activeTaskId;
      if(typeof d.cycles === "number") base.cycles = d.cycles;
      if(d.mode && MODES[d.mode]) base.mode = d.mode;
    }
  }catch(e){ /* first run, private window, or blocked storage — defaults are fine */ }
  return base;
}

function allThemes(){ return Object.assign({}, THEMES, S.customThemes || {}); }
function theme(){ return allThemes()[S.theme] || THEMES.auraTwilight; }

/* Builds a full theme from the five choices in the builder, so a custom theme
   behaves exactly like a built-in one everywhere else in the app. */
function makeTheme(f){
  const light = !f.light;             // f.light === true means light text on dark ground
  const bg = f.style === "radial"
      ? "radial-gradient(circle at 50% 35%, "+f.b+" 0%, "+f.a+" 72%)"
    : f.style === "animated"
      ? "linear-gradient(120deg, "+f.a+", "+f.b+", "+f.accent+", "+f.a+")"
      : "linear-gradient(135deg, "+f.a+" 0%, "+f.b+" 100%)";
  return {
    name: f.name || "My theme", bg: bg, solid: f.a,
    animated: f.style === "animated" ? 1 : 0,
    text: f.light ? "#ffffff" : "#17141f",
    sub: f.light ? "rgba(255,255,255,.6)" : "rgba(23,20,31,.58)",
    card: f.light ? "rgba(255,255,255,.12)" : "rgba(23,20,31,.07)",
    border: f.light ? "rgba(255,255,255,.22)" : "rgba(23,20,31,.14)",
    accent: f.accent, onAccent: f.light ? "#ffffff" : "#ffffff",
    dark: f.light ? 1 : 0, custom: 1,
    form: {name:f.name, a:f.a, b:f.b, style:f.style, accent:f.accent, light:f.light}
  };
}

function applyTheme(){
  const th = theme();
  const r = document.documentElement.style;
  r.setProperty("--bg", th.bg);
  r.setProperty("--solid", th.solid);
  r.setProperty("--text", th.text);
  r.setProperty("--sub", th.sub);
  r.setProperty("--card", th.card);
  r.setProperty("--border", th.border);
  r.setProperty("--accent", th.accent);
  r.setProperty("--onAccent", th.onAccent);
  r.setProperty("--panel", th.dark ? "rgba(12,12,16,.9)" : "rgba(28,20,30,.92)");
  document.documentElement.style.colorScheme = th.dark ? "dark" : "light";
  $("#app").classList.toggle("anim", !!th.animated);
}

/* City skyline with lit windows; `night` dims the sun into a streetlamp glow. */
function skylineSvg(night){
  let b = "", w = "";
  let x = -10;
  while(x < 410){
    const bw = 18 + Math.random()*30, bh = 60 + Math.random()*130;
    b += '<rect x="'+x.toFixed(1)+'" y="'+(300-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+
      '" fill="rgba(8,10,24,'+(night?.86:.72)+')"/>';
    for(let wy = 300-bh+10; wy < 292; wy += 13){
      for(let wx = x+5; wx < x+bw-6; wx += 10){
        if(Math.random() > .55) w += '<rect x="'+wx.toFixed(1)+'" y="'+wy.toFixed(1)+
          '" width="4" height="6" fill="rgba(255,214,140,'+(Math.random()*.55+.3).toFixed(2)+')"/>';
      }
    }
    x += bw + 3 + Math.random()*7;

/* ============================ audio ============================ */
let actx = null, noise = null, gainNode = null, sweepTimer = null;
function ctx(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }
  if(actx.state === "suspended") actx.resume();
  return actx;
}
function noiseBuffer(c, kind){
  const len = c.sampleRate * 3;
  const buf = c.createBuffer(1, len, c.sampleRate);
  const out = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
  for(let i=0;i<len;i++){
    const w = Math.random()*2-1;
    if(kind === "white"){ out[i] = w*.5; }
    else if(kind === "pink"){
      b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.96900*b2+w*.1538520;
      b3=.86650*b3+w*.3104856; b4=.55000*b4+w*.5329522; b5=-.7616*b5-w*.0168980;
      out[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.09; b6=w*.115926;
    } else { // brown
      last = (last + .02*w)/1.02; out[i] = last*3.2;
    }
  }
  return buf;
}
function stopNoise(){
  clearInterval(sweepTimer); sweepTimer = null;
  if(noise){ try{ noise.stop(); noise.disconnect(); }catch(e){} noise = null; }
  if(gainNode){ try{ gainNode.disconnect(); }catch(e){} gainNode = null; }
}
function startNoise(){
  const c = ctx(); if(!c) return false;
  stopNoise();
  const cfg = SOUNDS[S.settings.sound] || SOUNDS.rain;
  const src = c.createBufferSource();
  src.buffer = noiseBuffer(c, cfg.type);
  src.loop = true;
  const filter = c.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = cfg.cut;
  const g = c.createGain();
  g.gain.value = S.settings.volume;
  src.connect(filter); filter.connect(g); g.connect(c.destination);
  src.start();
  noise = src; gainNode = g;
  if(cfg.sweep){ // slow swell for the ocean preset
    let up = true;
    sweepTimer = setInterval(function(){
      const target = up ? S.settings.volume : S.settings.volume*.35;
      up = !up;
      try{ g.gain.linearRampToValueAtTime(target, c.currentTime+5); }catch(e){}
    }, 5000);
  }
  return true;
}
function chime(){
  if(!S.settings.chime) return;
  const c = ctx(); if(!c) return;
  [523.25, 659.25, 783.99].forEach(function(f, i){
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = f;
    const t0 = c.currentTime + i*0.16;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(.22, t0+.02);
    g.gain.exponentialRampToValueAtTime(.001, t0+.9);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+1);
  });
}

/* ============================ cloud accounts ============================
   Everything here is optional. With no Supabase project configured the app
   behaves exactly as before: all data stays in this browser. Signed in, the
   same data is mirrored to your own Postgres database and merged back on
   every device you log into. */
const CLOUD_KEY = "focusstudy.cloud";
const SYNC_KEY  = "focusstudy.lastpush";
let sb = null, me = null, cloudErr = null, syncing = false, lastSync = 0;

function cloudCfg(){
  if(SUPABASE_URL && SUPABASE_ANON_KEY) return {url:SUPABASE_URL, anonKey:SUPABASE_ANON_KEY, baked:true};
  try{
    const r = JSON.parse(localStorage.getItem(CLOUD_KEY) || "null");
    if(r && r.url && r.anonKey) return r;
  }catch(e){}
  return null;
}
function lastPush(){ try{ return +localStorage.getItem(SYNC_KEY) || 0; }catch(e){ return 0; } }
function setLastPush(t){ try{ localStorage.setItem(SYNC_KEY, String(t)); }catch(e){} }

/* What travels to the cloud. The background picture is deliberately left out:
   it can be hundreds of kilobytes and belongs to the device it was chosen on. */
function stateBlob(){
  return {settings:S.settings, tasks:S.tasks, routines:S.routines, theme:S.theme,
    customThemes:S.customThemes, themeForm:S.themeForm, scene:S.scene, music:S.music,
    plan:S.plan, planForm:S.planForm, cycles:S.cycles, activeTaskId:S.activeTaskId};
}
function adoptBlob(d){
  if(!d) return;
  if(d.settings) S.settings = Object.assign({}, S.settings, d.settings);
  if(Array.isArray(d.tasks)) S.tasks = d.tasks;
  if(Array.isArray(d.routines) && d.routines.length) S.routines = d.routines;
  if(d.customThemes) S.customThemes = d.customThemes;
  if(d.theme && allThemes()[d.theme]) S.theme = d.theme;
  if(d.themeForm) S.themeForm = Object.assign({}, S.themeForm, d.themeForm);
  if(d.scene && SCENES[d.scene]) S.scene = d.scene;
  if(d.music) S.music = Object.assign({}, S.music, d.music);
  if(d.plan !== undefined) S.plan = d.plan;
  if(d.planForm) S.planForm = Object.assign({}, S.planForm, d.planForm);
  if(typeof d.cycles === "number") S.cycles = d.cycles;
  if(d.activeTaskId !== undefined) S.activeTaskId = d.activeTaskId;
}

/* The library normally arrives from the script tag above; if that host is
   unreachable we try the mirror once before giving up. */
function loadLib(url){
  return new Promise(function(res, rej){
    const s = document.createElement("script");
    s.src = url; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function initCloud(){
  const cfg = cloudCfg();
  if(!cfg) return;
  if(!window.supabase || !window.supabase.createClient){
    try{ await loadLib("https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"); }
    catch(e){}
  }
  if(!window.supabase || !window.supabase.createClient){
    cloudErr = "The Supabase library didn't load. In the artifact preview that's expected — accounts only work on your own hosted copy.";
    renderAccountIfOpen(); return;
  }
  try{
    sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
      auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}
    });
    const res = await sb.auth.getSession();
    me = (res.data && res.data.session) ? res.data.session.user : null;
    sb.auth.onAuthStateChange(function(ev, sess){
      me = sess ? sess.user : null;
      renderAccountIfOpen();
      if(me && (ev === "SIGNED_IN" || ev === "INITIAL_SESSION")) syncAll(true);
    });
    if(me) syncAll(true);
  }catch(e){
    cloudErr = "Couldn't reach that Supabase project. Check the URL and key.";
  }
  renderAccountIfOpen();
}

function friendlyAuthError(e){
  const m = ((e && (e.message || e.error_description)) || "").toLowerCase();
  if(m.indexOf("invalid login") >= 0) return "That email and password don't match an account.";
  if(m.indexOf("already registered") >= 0 || m.indexOf("already been registered") >= 0)
    return "There's already an account with that email — try logging in.";
  if(m.indexOf("password should be") >= 0) return "Password needs to be at least 6 characters.";
  if(m.indexOf("email not confirmed") >= 0) return "Check your inbox and confirm your email first.";
  if(m.indexOf("rate limit") >= 0 || m.indexOf("too many") >= 0) return "Too many attempts. Wait a minute and try again.";
  if(m.indexOf("failed to fetch") >= 0 || m.indexOf("networkerror") >= 0)
    return "Couldn't reach your Supabase project — check the URL, or your connection.";
  return (e && e.message) ? e.message : "Something went wrong. Try again.";
}

/* Sessions are rows so your history survives a merge from two devices;
   everything else is one JSON document, newest wins. */
async function syncSessions(){
  const r = await sb.from("sessions").select("id,date,type,minutes,task_name,at").eq("user_id", me.id);
  if(r.error) throw r.error;
  const rows = r.data || [];
  const localIds = {}; S.sessions.forEach(function(s){ localIds[String(s.id)] = true; });
  const remoteIds = {};
  rows.forEach(function(x){
    remoteIds[x.id] = true;
    if(!localIds[x.id]){
      S.sessions.push({id:x.id, date:x.date, type:x.type, minutes:Number(x.minutes),
        taskName:x.task_name, taskId:null, at:new Date(x.at).getTime()});
    }
  });
  const push = S.sessions.filter(function(s){ return !remoteIds[String(s.id)]; }).map(function(s){
    return {id:String(s.id), user_id:me.id, date:s.date, type:s.type,
      minutes:s.minutes, task_name:s.taskName || null,
      at:new Date(s.at || Date.now()).toISOString()};
  });
  if(push.length){
    const w = await sb.from("sessions").upsert(push, {onConflict:"user_id,id"});
    if(w.error) throw w.error;
  }
  S.sessions.sort(function(a,b){ return (a.at||0) - (b.at||0); });
}

async function syncAll(quiet){
  if(!sb || !me || syncing) return;
  syncing = true; cloudErr = null; renderAccountIfOpen();
  try{
    const r = await sb.from("app_state").select("data,updated_at").eq("user_id", me.id).maybeSingle();
    if(r.error) throw r.error;
    const remote = r.data;
    const remoteAt = remote ? new Date(remote.updated_at).getTime() : 0;
    if(remote && remoteAt > lastPush()){ adoptBlob(remote.data); }   // another device is ahead
    await syncSessions();
    const now = Date.now();
    const w = await sb.from("app_state").upsert({user_id:me.id, data:stateBlob(),
      updated_at:new Date(now).toISOString()}, {onConflict:"user_id"});
    if(w.error) throw w.error;
    setLastPush(now); lastSync = now;
    save(); applyScene(true); render();
    if(!quiet) toast("Synced");
  }catch(e){
    cloudErr = friendlyAuthError(e);
    if(!quiet) toast("Sync failed: "+cloudErr, 4000);
  }
  syncing = false; renderAccountIfOpen();
}

let pushTimer = null;
function cloudPush(){            // debounced mirror of local changes
  if(!sb || !me) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async function(){
    try{
      const now = Date.now();
      const w = await sb.from("app_state").upsert({user_id:me.id, data:stateBlob(),
        updated_at:new Date(now).toISOString()}, {onConflict:"user_id"});
      if(!w.error){ setLastPush(now); lastSync = now; }
    }catch(e){}
  }, 2500);
}
async function cloudLogSession(s){
  if(!sb || !me) return;
  try{
    await sb.from("sessions").upsert([{id:String(s.id), user_id:me.id, date:s.date, type:s.type,

}
async function wipeCloud(){
  if(!sb || !me) return;
  try{
    await sb.from("sessions").delete().eq("user_id", me.id);
    await sb.from("app_state").delete().eq("user_id", me.id);
    setLastPush(0);
    toast("Cloud copy deleted. This device still has your data.", 4000);
  }catch(e){ toast("Couldn't delete: "+friendlyAuthError(e), 4000); }

}

/* ============================ timer core ============================ */
/* ============================ plan builder ============================
   Turns "I have 1h40" into a real sequence of focus blocks and breaks.
   includeBreaks=true  → the breaks come out of the time you gave me
   includeBreaks=false → the time you gave me is focus only, breaks sit on top */
/* Where the long breaks go when it's left on Auto: decided by how long the session is.
   Under ~90 min of focus (or fewer than 3 blocks) a long break isn't worth it — short
   breaks only. Longer sessions get one long break per "blocks before a long break"
   setting, spread evenly through the plan so they land near the middle, not the end. */
const AUTO_LONG_MIN = 90;
function autoLongSpots(nb, focusMin){
  const N = Math.max(1, S.settings.before);
  if(nb < 3 || focusMin < AUTO_LONG_MIN) return [];
  const count = Math.max(1, Math.floor((nb-1)/N));
  const out = [];
  for(let i = 1; i <= count; i++){
    const at = Math.min(nb-1, Math.max(1, Math.round(i*nb/(count+1))));
    if(out.indexOf(at) < 0) out.push(at);
  }
  return out;
}
function sortPicks(a){       // block numbers in order, "end" (after the last block) last
  return a.slice().sort(function(x,y){ return (x==="end"?1e9:x) - (y==="end"?1e9:y); });
}
function longList(v){                     // custom picks: older saves stored a single number
  if(typeof v === "number") return [v];
  return Array.isArray(v) ? v : null;
}
function focusStats(steps){
  const f = (steps||[]).filter(function(x){ return x.type === "focus"; });
  return {n:f.length, min:f.reduce(function(a,x){ return a+x.min; }, 0)};
}
/* ---------- automatic break lengths ----------
   Breaks scale with how much focus they follow. Anchors: 100 min of focus (25 x 4) gets
   5-min short / 15-min long breaks; 120 min (e.g. 30 x 4, or a 2h plan) gets 8 / 18.
   Beyond that they grow gently and level off at 10 / 30. A long block also earns at
   least a fifth of itself as a short break (50-min block -> 10 min). */
function aN(n){ return /^(8|11|18)/.test(String(n)) ? "an "+n : "a "+n; }   // "an 18-min", "a 15-min"
function interp(pts, x){
  if(x <= pts[0][0]) return pts[0][1];
  for(let i = 1; i < pts.length; i++){
    if(x <= pts[i][0]){
      const a = pts[i-1], b = pts[i];
      return a[1] + (b[1]-a[1]) * (x-a[0]) / (b[0]-a[0]);
    }
  }
  return pts[pts.length-1][1];
}
function autoBreakLens(focusMin, blockMin){
  const sh = interp([[0,5],[100,5],[120,8],[180,10]], focusMin);
  const lo = interp([[0,15],[100,15],[120,18],[180,25],[240,30]], focusMin);
  return {
    short: Math.min(15, Math.max(Math.round(sh), Math.round((blockMin||25)/5))),
    long:  Math.min(30, Math.max(Math.round(lo), Math.round((blockMin||25)*0.6)))
  };
}
let BRK = null;                          // break lengths in force while a plan is being built
function curBrk(){ return BRK || {short:Math.max(1,S.settings.short), long:Math.max(1,S.settings.long)}; }
function pomoBreaks(){                   // what the Pomodoro cycle uses
  const s = S.settings;
  return s.autoBreaks ? autoBreakLens(s.work*Math.max(1,s.before), s.work) : {short:s.short, long:s.long};
}
function breakOf(steps){                 // the short / long lengths a built plan actually uses
  const sh = (steps||[]).filter(function(x){ return x.type === "short"; })[0];
  const lo = (steps||[]).filter(function(x){ return x.type === "long"; })[0];
  return {short: sh ? sh.min : null, long: lo ? lo.min : null};
}
function buildPlan(totalMin, includeBreaks, even, opts){
  if(!S.settings.autoBreaks){ BRK = null; return buildPlanLong(totalMin, includeBreaks, even, opts); }
  // break length depends on focus time, and focus time depends on the breaks when they
  // come out of the total, so settle it in a few passes
  let lens = autoBreakLens(includeBreaks ? totalMin*0.85 : totalMin, S.settings.work), st = null;
  try{
    for(let i = 0; i < 4; i++){
      BRK = lens;
      st = buildPlanLong(totalMin, includeBreaks, even, opts);
      if(!st) break;
      const fs = focusStats(st);
      const next = autoBreakLens(fs.min, fs.n ? fs.min/fs.n : S.settings.work);
      if(next.short === lens.short && next.long === lens.long) break;
      lens = next;
    }
  } finally { BRK = null; }
  return st;
}
function buildPlanLong(totalMin, includeBreaks, even, opts){
  opts = opts || {};
  const longAt = opts.longAt === undefined ? "auto" : opts.longAt;
  if(longAt === "auto"){
    // build once without long breaks to see how big the session is, then place them;
    // a long break can shift the block count, so settle it with one more pass
    let st = buildPlanWith(totalMin, includeBreaks, even, opts.blocks, []);
    if(!st) return null;
    let fs = focusStats(st), spots = autoLongSpots(fs.n, fs.min);
    if(!spots.length) return st;
    st = buildPlanWith(totalMin, includeBreaks, even, opts.blocks, spots);
    if(!st) return null;
    const fs2 = focusStats(st);
    if(fs2.n !== fs.n){
      const spots2 = autoLongSpots(fs2.n, fs2.min);
      st = buildPlanWith(totalMin, includeBreaks, even, opts.blocks, spots2) || st;
    }
    return st;
  }
  return buildPlanWith(totalMin, includeBreaks, even, opts.blocks, longAt === "none" ? [] : (longList(longAt) || []));
}
/* "end" in the picks means a long break after the last block. When breaks come out of
   the time available, its minutes are set aside first so the plan still finishes on time. */
function buildPlanWith(totalMin, includeBreaks, even, blocks, spots){
  const LB = curBrk().long;
  const endLong = spots.indexOf("end") >= 0;
  const room = (endLong && includeBreaks && totalMin - LB >= 5) ? totalMin - LB : totalMin;
  const st = buildPlanCore(room, includeBreaks, even, blocks, spots);
  if(st && endLong) st.push({type:"long", min:LB});
  return st;
}
function buildPlanCore(totalMin, includeBreaks, even, blocks, spots){
  const s = S.settings;
  const W = Math.max(5, s.work), SB = curBrk().short, LB = curBrk().long;
  function longAfter(n){ return spots.indexOf(n) >= 0; }
  const MIN = Math.min(10, W);            // shortest block worth starting
  let left = Math.max(1, Math.round(totalMin)), steps = [], n = 0;

  // The person picked how many focus blocks they want: split the focus time evenly across them
  const B = Math.round(blocks || 0);
  if(B >= 1){
    const brs = [];
    for(let i = 1; i < B; i++) brs.push(longAfter(i) ? {type:"long", min:LB} : {type:"short", min:SB});
    const breakSum = brs.reduce(function(a,x){ return a + x.min; }, 0);
    const focusTotal = includeBreaks ? left - breakSum : left;
    if(focusTotal < B*5) return null;       // blocks would be shorter than 5 minutes
    const base = Math.floor(focusTotal / B), extra = focusTotal - base*B;
    for(let i = 0; i < B; i++){
      steps.push({type:"focus", min: base + (i < extra ? 1 : 0)});
      if(i < B-1) steps.push(brs[i]);
    }
    return steps;
  }

  if(left < MIN) return [{type:"focus", min:left}];

  while(left >= MIN){
    const len = Math.min(W, left);
    steps.push({type:"focus", min:len});
    n++; left -= len;
    const isLong = longAfter(n);
    const br = {type: isLong ? "long" : "short", min: isLong ? LB : SB};
    if(includeBreaks){
      if(left - br.min >= MIN){ steps.push(br); left -= br.min; } else break;
    } else {
      if(left >= MIN){ steps.push(br); } else break;
    }
  }
  // what's left over: a few spare minutes get added to the last block, but a
  // chunk big enough to work in gets its own break and block instead
  if(left > 0){
    const isLong = longAfter(n);
    const br = {type: isLong ? "long" : "short", min: isLong ? LB : SB};
    if(includeBreaks && left > 10 && left - br.min >= 5){
      steps.push(br);
      steps.push({type:"focus", min: left - br.min});
    } else {
      for(let i = steps.length-1; i >= 0; i--){
        if(steps[i].type === "focus"){ steps[i].min += left; break; }
      }
    }
  }
  while(steps.length && steps[steps.length-1].type !== "focus") steps.pop();  // never end on a break

  if(even){
    const focus = steps.filter(function(x){ return x.type === "focus"; });
    const tot = focus.reduce(function(a,x){ return a+x.min; }, 0);
    const per = Math.max(5, Math.round(tot/focus.length));
    focus.forEach(function(x, i){
      x.min = i === focus.length-1 ? Math.max(5, tot - per*(focus.length-1)) : per;
    });
  }
  return steps;
}
function planSteps(){ return (S.plan && S.plan.steps) || []; }
function planDone(){ return S.plan ? S.plan.index >= S.plan.steps.length : true; }
function planStep(){
  const st = planSteps();
  if(!st.length) return null;
  return st[Math.min(S.plan.index, st.length-1)];
}
function planFocusLeft(){
  return planSteps().slice(S.plan ? S.plan.index : 0)
    .reduce(function(a,x){ return a + (x.type === "focus" ? x.min : 0); }, 0);
}
function planBlockNo(){
  const st = planSteps();
  let n = 0;
  for(let i = 0; i <= Math.min(S.plan.index, st.length-1); i++) if(st[i].type === "focus") n++;
  return n;
}
function planBlockTotal(){
  return planSteps().filter(function(x){ return x.type === "focus"; }).length;
}
function startPlan(){
  S.plan.index = 0;
  T.mode = "plan"; S.mode = "plan";
  T.phase = planSteps()[0].type;
  T.running = false;
  T.leftMs = totalMs();
  save(); render();
}

/* The plan follows the settings live: any change in the panel rebuilds it straight
   away, as long as you haven't started it yet (or it's finished). A plan that's
   already running is left alone so a stray tap can't reshuffle your session. */
function planFresh(){
  return !S.plan || !planSteps().length || planDone() ||
    (S.plan.index === 0 && !T.running && leftNow() >= totalMs());
}
function autoRebuild(){
  if(T.mode !== "plan" || !planFresh()) return false;
  const f = S.planForm, total = f.h*60 + f.m;
  if(total < 5) return false;
  const steps = buildPlan(total, f.includeBreaks, f.even, {blocks:f.blocks, longAt:f.longAt});
  if(!steps) return false;
  S.plan = {steps:steps, index:0, total:total, includeBreaks:f.includeBreaks, even:f.even, blocks:f.blocks,
    longAt: Array.isArray(f.longAt) ? f.longAt.slice() : f.longAt};
  T.phase = steps[0].type; T.running = false; T.leftMs = totalMs();
  return true;
}
function planFormChanged(){ autoRebuild(); render(); }

function phaseMinutes(){
  const s = S.settings;
  if(T.mode === "plan"){ const st = planStep(); return st ? st.min : s.work; }
  if(T.mode === "custom") return s.custom;
  if(T.mode === "animedoro") return T.phase === "focus" ? s.animeWork : s.animeBreak;
  if(T.phase === "focus") return s.work;
  if(T.phase === "short") return pomoBreaks().short;
  return pomoBreaks().long;
}
function totalMs(){ return phaseMinutes()*60000; }
function leftNow(){
  if(T.mode === "stopwatch") return 0;
  return T.running ? Math.max(0, T.endsAt - Date.now()) : T.leftMs;
}
function elapsedSw(){
  return T.swBase + (T.running ? Date.now() - T.swStart : 0);
}
function resetToPhase(){
  T.running = false;
  T.leftMs = totalMs();
  T.swBase = 0;
  render();
}
function start(){
  if(T.running) return;
  ctx(); // unlock audio on the user gesture that started the session
  if(T.mode === "plan"){
    if(!planSteps().length){ openPanel("timer"); toast("Build a plan first"); return; }
    if(planDone()){ S.plan.index = 0; T.phase = planSteps()[0].type; T.leftMs = totalMs(); }
  }
  T.running = true;
  if(T.mode === "stopwatch"){ T.swStart = Date.now(); }
  else { if(T.leftMs <= 0) T.leftMs = totalMs(); T.endsAt = Date.now() + T.leftMs; }
  requestWakeLock();
  render();
}
function pause(){
  if(!T.running) return;
  if(T.mode === "stopwatch") T.swBase = elapsedSw();
  else T.leftMs = Math.max(0, T.endsAt - Date.now());
  T.running = false;
  releaseWakeLock();
  render();
}
function toggle(){ T.running ? pause() : start(); }

function logSession(type, minutes, taskId){
  if(!(minutes > 0.05)) return;
  const task = S.tasks.filter(function(t){ return t.id === taskId; })[0];
  const row = {
    id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
    date: dayKey(), at: Date.now(), type: type,
    minutes: Math.round(minutes*10)/10,
    taskId: taskId || null, taskName: task ? task.name : null
  };
  S.sessions.push(row);
  if(type === "focus" && task){ task.pomos = (task.pomos||0)+1; }
  save(); cloudLogSession(row);
}

/* Ends the current phase. `skipped` means the user cut it short, so only the
   time actually spent is logged — not the full planned block. */
function finish(skipped){
  const spentMin = T.mode === "stopwatch"
    ? elapsedSw()/60000
    : (totalMs() - (skipped ? leftNow() : 0))/60000;
  const wasFocus = (T.mode === "custom" || T.mode === "stopwatch") ? true : T.phase === "focus";
  const planMode = T.mode === "plan";

  logSession(wasFocus ? "focus" : "break", spentMin, wasFocus ? S.activeTaskId : null);
  chime();
  nextQuote();

  if(T.mode === "stopwatch"){
    T.running = false; T.swBase = 0; releaseWakeLock();
    toast(spentMin >= .1 ? "Logged "+Math.round(spentMin)+" min" : "Stopwatch reset");
    render(); return;
  }
  if(T.mode === "custom"){
    T.running = false; T.leftMs = totalMs(); releaseWakeLock();
    toast(skipped ? "Session ended early — time logged" : "Countdown complete. Nice work.");
    render(); return;
  }

  if(planMode){
    if(wasFocus) S.cycles += 1;
    S.plan.index += 1;
    T.running = false;
    if(planDone()){
      releaseWakeLock();
      const total = planSteps().reduce(function(a,x){ return a + (x.type==="focus"?x.min:0); }, 0);
      T.leftMs = 0;
      toast("Plan finished — "+total+" minutes of focus. Done for the session.", 4000);
    } else {
      T.phase = planStep().type;
      T.leftMs = totalMs();
      const left = planBlockTotal() - planBlockNo() + (T.phase === "focus" ? 1 : 0);
      toast(T.phase === "focus" ? "Block "+planBlockNo()+" of "+planBlockTotal()
        : (T.phase === "long" ? "Long break" : "Short break")+(left > 0 ? " — "+left+" block"+(left===1?"":"s")+" to go" : " — last block done"));
      if(S.settings.autoStart) setTimeout(start, 900); else releaseWakeLock();
    }
    save(); render(); return;
  }

  // pomodoro / animedoro cycle
  if(T.phase === "focus"){
    S.cycles += 1;
    const before = T.mode === "animedoro" ? 99 : Math.max(1, S.settings.before);
    if(S.cycles % before === 0){ T.phase = "long"; toast("Round done — take a long break."); }
    else { T.phase = "short"; toast("Focus done — short break."); }
  } else {
    T.phase = "focus"; toast("Break's over. Back in.");
  }
  T.leftMs = totalMs();
  T.running = false;
  save();
  if(S.settings.autoStart){ setTimeout(start, 900); } else { releaseWakeLock(); }
  render();
}

function skip(){
  if(T.mode === "stopwatch"){
    if(elapsedSw() < 3000){ toast("Nothing to log yet"); return; }
    pause(); finish(true); return;
  }
  const spent = totalMs() - leftNow();
  pause();
  if(spent < 3000 && T.mode !== "plan"){ // nothing meaningful spent — just jump the phase
    if(T.mode === "custom"){ resetToPhase(); return; }
    T.phase = T.phase === "focus" ? "short" : "focus";
    resetToPhase(); return;
  }
  finish(true);
}

function setMode(m){
  T.mode = m; S.mode = m;
  T.running = false; T.swBase = 0;
  if(m === "plan" && planSteps().length){
    if(planDone()) S.plan.index = 0;
    T.phase = planStep().type;
  } else {
    T.phase = "focus";
  }
  T.leftMs = totalMs();
  save(); render();
}
function setPhase(p){
  if(T.mode !== "pomodoro" && T.mode !== "animedoro") return;
  T.phase = p; T.running = false; T.leftMs = totalMs(); render();
}

/* One tick drives everything. 250ms keeps the seconds crisp; the value shown is
   always computed from Date.now(), so throttling or sleep can't desync it. */
setInterval(function(){
  if(T.running && T.mode !== "stopwatch" && Date.now() >= T.endsAt){ finish(false); return; }
  if(T.running) paint();
}, 250);
document.addEventListener("visibilitychange", function(){
  if(!document.hidden){ paint(); }
  else if(T.running && shield.on){ shield.strays += 1; }
});

/* ============================ wake lock ============================ */
let wakeLock = null;
function requestWakeLock(){
  if(!navigator.wakeLock || wakeLock) return;
  navigator.wakeLock.request("screen").then(function(w){
    wakeLock = w;
    w.addEventListener("release", function(){ wakeLock = null; });
  }).catch(function(){ /* not granted here; harmless */ });
}
function releaseWakeLock(){ if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; } }

/* ============================ focus shield ============================ */
const shield = { on:false, strays:0, since:0 };
function toggleShield(){
  shield.on = !shield.on;
  $("#btnShield").setAttribute("aria-pressed", String(shield.on));
  if(shield.on){
    shield.strays = 0; shield.since = Date.now();
    const el = document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
    if(!T.running) start();
    toast("Shield on. Leaving this tab gets counted.");
  } else {
    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
    toast(shield.strays === 0 ? "Shield off — zero stray tabs. Clean run." :
      "Shield off — you left "+shield.strays+" time"+(shield.strays===1?"":"s")+".");
  }
  renderShield();
}
function renderShield(){
  const box = $("#shield");
  box.classList.toggle("on", shield.on && !T.running);
  if(shield.on && !T.running){
    $("#shieldTitle").textContent = "Shield on · timer paused";
    $("#shieldBody").textContent = shield.strays
      ? "You've left this tab "+shield.strays+" time"+(shield.strays===1?"":"s")+" this run. Press start to get back in."
      : "Press start to get back in.";
  }
}

/* ============================ stats ============================ */
function focusOn(key){
  return S.sessions.reduce(function(a,s){
    return a + (s.date === key && s.type === "focus" ? s.minutes : 0); }, 0);
}
function streakCount(){
  const days = {};
  S.sessions.forEach(function(s){ if(s.type==="focus") days[s.date] = true; });
  let n = 0, d = new Date();
  if(!days[dayKey(d)]) d.setDate(d.getDate()-1);
  while(days[dayKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
/* Focus score blends how much of today's goal you hit (70) with how many of
   today's focus blocks you saw through instead of skipping (30). */
function focusScore(){
  const key = dayKey();
  const mins = focusOn(key);
  const goal = Math.max(10, S.settings.goal);
  const today = S.sessions.filter(function(s){ return s.date===key && s.type==="focus"; });
  const full = today.filter(function(s){ return s.minutes >= S.settings.work*0.9; }).length;
  const rate = today.length ? full/today.length : 0;
  return Math.min(100, Math.round(Math.min(1, mins/goal)*70 + rate*30));
}
function seriesData(days){
  const out = [];
  for(let i = days-1; i >= 0; i--){
    const d = shiftDay(-i), key = dayKey(d);
    out.push({
      key: key,
      label: days <= 7 ? d.toLocaleDateString(undefined,{weekday:"short"}).slice(0,2) : String(d.getDate()),
      min: Math.round(focusOn(key))
    });
  }
  return out;
}
function barsSvg(data){
  const w = 320, h = 128, pad = 20, gap = data.length > 10 ? 2 : 6;
  const max = Math.max(30, Math.max.apply(null, data.map(function(d){ return d.min; })));
  const bw = (w - pad*2 - gap*(data.length-1)) / data.length;
  let bars = "", labels = "";
  data.forEach(function(d, i){
    const bh = Math.max(d.min > 0 ? 3 : 0, (d.min/max) * (h - 34));
    const x = pad + i*(bw+gap), y = h - 18 - bh;
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+
      '" rx="'+Math.min(4,bw/2).toFixed(1)+'" fill="var(--accent)" opacity="'+(d.min?1:.25)+'"></rect>';
    if(data.length <= 10 || i % 5 === 0){
      labels += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-5)+'" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,.5)">'+esc(d.label)+'</text>';
    }
  });
  const gl = [max, Math.round(max/2)].map(function(v){
    const y = h - 18 - (v/max)*(h-34);
    return '<line x1="'+pad+'" x2="'+(w-pad)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,.1)" stroke-dasharray="3 3"/>'+
      '<text x="2" y="'+(y+3).toFixed(1)+'" font-size="9" fill="rgba(255,255,255,.4)">'+v+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img" aria-label="Focus minutes per day">'+gl+bars+labels+'</svg>';
}
function ringSvg(score){
  const r = 30, c = 2*Math.PI*r, off = c*(1-score/100);
  return '<svg class="ring" width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="Focus score '+score+' out of 100">'+
    '<circle cx="38" cy="38" r="'+r+'" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="7"/>'+
    '<circle cx="38" cy="38" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" '+
    'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 38 38)"/>'+
    '<text x="38" y="43" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">'+score+'</text></svg>';
}

/* ============================ music ============================ */
function embedUrl(service, raw){
  const url = (raw||"").trim();
  if(!url) return null;
  let m;
  if(service === "spotify"){
    m = url.match(/spotify:(playlist|album|track|artist|show|episode):([A-Za-z0-9]+)/) ||
        url.match(/open\.spotify\.com\/(?:embed\/)?(?:intl-[a-z]{2}\/)?(?:user\/[^\/]+\/)?(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/);
    return m ? "https://open.spotify.com/embed/"+m[1]+"/"+m[2] : null;
  }
  if(service === "youtube" || service === "ytmusic"){
    // Playlist ids that start with RD/UL are auto-generated mixes: they can't be embedded as a
    // series, so for those we fall back to the single video in the link.
    const base = "https://www.youtube-nocookie.com/embed/";
    const vid = url.match(/(?:youtu\.be\/|[?&]v=|youtube(?:-nocookie)?\.com\/(?:embed|shorts|live|v)\/)([A-Za-z0-9_-]{11})/);
    const lst = url.match(/[?&]list=([A-Za-z0-9_-]+)/);
    if(lst && !/^(RD|UL|TL)/.test(lst[1])) return base+(vid ? vid[1] : "videoseries")+"?list="+lst[1]+"&rel=0";
    if(vid) return base+vid[1]+"?rel=0";
    if(/^[A-Za-z0-9_-]{11}$/.test(url)) return base+url+"?rel=0";
    return null;
  }
  if(service === "apple"){
    if(/music\.apple\.com\/[a-z]{2}\/library\//i.test(url)) return null;   // private library links can't be embedded
    m = url.match(/(?:embed\.)?music\.apple\.com\/([^?#\s]+)/);
    return m ? "https://embed.music.apple.com/"+m[1].replace(/\/+$/,"") : null;
  }
  return null;
}
function openMusic(){
  const link = (S.music.links[S.music.service]||"").trim();
  if(!link){ openPanel("music"); toast("Add a "+SERVICES[S.music.service].label+" link first"); return; }
  window.open(link, "_blank", "noopener");
}

/* ============================ render ============================ */
function nextQuote(){
  $("#quote").textContent = "“"+QUOTES[Math.floor(Math.random()*QUOTES.length)]+"”";
}
function phaseLabel(){
  if(T.mode === "stopwatch") return "Stopwatch";
  if(T.mode === "custom") return "Countdown";
  if(T.mode === "plan"){
    if(!planSteps().length) return "No plan yet";
    if(planDone()) return "Plan complete";
    return T.phase === "focus" ? "Block "+planBlockNo()+" of "+planBlockTotal()
      : (T.phase === "long" ? "Long break" : "Short break");
  }
  if(T.phase === "focus") return T.mode === "animedoro" ? "Episode block" : "Focus";
  return T.phase === "short" ? "Short Break" : "Long Break";
}
/* ============================ timer faces ============================ */
let faceKey = null, lastDigits = "";
function buildFace(){
  const k = FACES[S.settings.face] ? S.settings.face : "digital";
  const el = $("#face");
  faceKey = k; lastDigits = "";
  const sz = S.settings.size;
  if(k === "digital"){
    el.innerHTML = '<div class="f-digital" id="fText">00:00</div>';
    const d = $("#fText");
    d.style.fontSize = "clamp(44px, "+sz+"px, 20vw)";
    d.style.letterSpacing = S.settings.spacing+"em";
  }
  else if(k === "flip"){
    el.innerHTML = '<div class="f-flip" id="fFlip"></div>';
  }
  else if(k === "line"){
    el.innerHTML = '<div class="f-line"><div class="lt" id="fText">00:00</div>'+
      '<div class="track"><span class="fill" id="fFill"></span><span class="dot" id="fDot" style="left:0%"></span></div>'+
      '<div class="ends"><span id="fLeftEnd">Start</span><span id="fRightEnd"></span></div></div>';
    $("#fText").style.fontSize = "clamp(40px, "+(sz*0.8)+"px, 17vw)";
  }
  else if(k === "ring"){
    const R = 86, C = 2*Math.PI*R;
    el.innerHTML = '<svg class="f-svg" viewBox="0 0 200 200" width="min(300px,72vw)" role="img" aria-label="Timer">'+
      '<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="var(--card)" stroke-width="9"/>'+
      '<circle id="fArc" cx="100" cy="100" r="'+R+'" fill="none" stroke="var(--accent)" stroke-width="9" '+
      'stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+
      '" transform="rotate(-90 100 100)"/>'+
      '<text id="fText" x="100" y="108" text-anchor="middle" fill="var(--text)" '+
      'style="font-family:var(--timerFont);font-size:40px;font-weight:800;font-variant-numeric:tabular-nums">00:00</text>'+
      '<text id="fSub" x="100" y="132" text-anchor="middle" fill="var(--sub)" '+
      'style="font-size:11px;letter-spacing:.14em;text-transform:uppercase">focus</text></svg>';
    el.dataset.circ = C;
  }
  else if(k === "analog"){
    let ticks = "";
    for(let i=0;i<60;i++){
      const big = i%5===0, a = i*6*Math.PI/180;
      const r1 = big?74:79, r2 = 84;
      ticks += '<line x1="'+(100+r1*Math.sin(a)).toFixed(1)+'" y1="'+(100-r1*Math.cos(a)).toFixed(1)+
        '" x2="'+(100+r2*Math.sin(a)).toFixed(1)+'" y2="'+(100-r2*Math.cos(a)).toFixed(1)+
        '" stroke="var(--text)" stroke-width="'+(big?2.2:1)+'" opacity="'+(big?.75:.3)+'"/>';
    }
    let nums = "";
    [0,15,30,45].forEach(function(m){
      const a = m*6*Math.PI/180;
      nums += '<text x="'+(100+62*Math.sin(a)).toFixed(1)+'" y="'+(100-62*Math.cos(a)+5).toFixed(1)+
        '" text-anchor="middle" fill="var(--sub)" style="font-size:11px;font-weight:600">'+(m===0?60:m)+'</text>';
    });
    el.innerHTML = '<svg class="f-svg" viewBox="0 0 200 200" width="min(300px,72vw)" role="img" aria-label="Timer dial">'+
      '<circle cx="100" cy="100" r="92" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>'+
      '<path id="fPie" d="" fill="var(--accent)" opacity=".4"/>'+ticks+nums+
      '<line id="fHand" x1="100" y1="100" x2="100" y2="28" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round"/>'+
      '<line id="fSec" x1="100" y1="106" x2="100" y2="34" stroke="var(--text)" stroke-width="1.2" opacity=".65" stroke-linecap="round"/>'+
      '<circle cx="100" cy="100" r="5" fill="var(--text)"/>'+
      '<text id="fText" x="100" y="150" text-anchor="middle" fill="var(--text)" '+
      'style="font-family:var(--timerFont);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums">00:00</text></svg>';
  }
  // the separate bar under the timer would double up with these two faces
  $("#bar").style.display = (k === "line" || k === "ring") ? "none" : "block";
}
function arcPath(frac){ // pie wedge from 12 o'clock, clockwise
  if(frac <= 0) return "";
  if(frac >= .9999) return "M100 100 m-72 0 a72 72 0 1 0 144 0 a72 72 0 1 0 -144 0";
  const a = frac*2*Math.PI;
  const x = 100 + 72*Math.sin(a), y = 100 - 72*Math.cos(a);
  return "M100 100 L100 28 A72 72 0 "+(frac > .5 ? 1 : 0)+" 1 "+x.toFixed(2)+" "+y.toFixed(2)+" Z";
}
function paintFace(val, pct){
  const k = faceKey;
  if(k === "flip"){
    const wrap = $("#fFlip"); if(!wrap) return;
    if(val.length !== lastDigits.length){
      const sz = S.settings.size;
      wrap.innerHTML = val.split("").map(function(c,i){
        return c === ":" ? '<span class="sep" style="font-size:'+Math.round(sz*.55)+'px">:</span>'
          : '<span class="f-card" id="fd'+i+'" style="width:'+Math.round(sz*.72)+'px;height:'+Math.round(sz*1.02)+
            'px;font-size:'+Math.round(sz*.72)+'px">'+c+'</span>';
      }).join("");
      lastDigits = val;
      return;
    }
    for(let i=0;i<val.length;i++){
      if(val[i] === lastDigits[i]) continue;
      const card = document.getElementById("fd"+i);
      if(card){
        card.textContent = val[i];
        card.classList.remove("turn"); void card.offsetWidth; card.classList.add("turn");
      }
    }
    lastDigits = val;
    return;
  }
  const t = $("#fText"); if(t) t.textContent = val;
  if(k === "line"){
    const f = $("#fFill"), d = $("#fDot"), r = $("#fRightEnd");
    if(f){ f.style.width = pct+"%"; d.style.left = pct+"%"; }
    if(r) r.textContent = T.mode === "stopwatch" ? "Counting up" : phaseMinutes()+" min";
  }
  else if(k === "ring"){
    const arc = document.getElementById("fArc"), sub = document.getElementById("fSub");
    if(arc){
      const C = parseFloat($("#face").dataset.circ);
      arc.setAttribute("stroke-dashoffset", (C*(1 - pct/100)).toFixed(1));
    }
    if(sub) sub.textContent = phaseLabel();
  }
  else if(k === "analog"){
    const pie = document.getElementById("fPie"), hand = document.getElementById("fHand"), sec = document.getElementById("fSec");
    const ms = T.mode === "stopwatch" ? elapsedSw() : leftNow();
    const mins = ms/60000;
    if(pie) pie.setAttribute("d", arcPath(Math.min(1, (mins%60)/60)));
    if(hand) hand.setAttribute("transform", "rotate("+((mins%60)*6).toFixed(2)+" 100 100)");
    if(sec) sec.setAttribute("transform", "rotate("+(((ms/1000)%60)*6).toFixed(2)+" 100 100)");
  }
}

function paint(){ // cheap, runs every tick
  const val = T.mode === "stopwatch" ? fmt(elapsedSw()) : fmt(leftNow());
  const tot = totalMs();
  const pct = Math.max(0, Math.min(100, T.mode === "stopwatch" ? 0 : tot ? (1 - leftNow()/tot)*100 : 0));
  if(faceKey !== S.settings.face) buildFace();
  paintFace(val, pct);
  $("#barFill").style.width = pct+"%";
  document.title = (T.running ? val+" · " : "")+phaseLabel()+" · Focusstudy";
  if(pipDoc) paintPip();
  if(vpip && document.pictureInPictureElement === vpip.video) vpipDraw();
}
function render(){
  applyTheme(); applyFont(); applyScene();

  // phase tabs
  const tabs = $("#phaseTabs");
  if(T.mode === "pomodoro" || T.mode === "animedoro"){
    const items = T.mode === "animedoro"
      ? [["focus","Episode block"],["short","Break"]]
      : [["focus","Focus"],["short","Short Break"],["long","Long Break"]];
    tabs.innerHTML = items.map(function(p){
      return '<button data-phase="'+p[0]+'" aria-pressed="'+(T.phase===p[0])+'">'+esc(p[1])+'</button>';
    }).join("");
  } else {
    tabs.innerHTML = '<button aria-pressed="true" disabled>'+esc(phaseLabel())+'</button>';
  }

  // progress markers: hearts for pomodoro, a proportional strip for a plan
  const before = Math.max(1, S.settings.before);
  if(T.mode === "plan"){
    const st = planSteps();
    $("#hearts").innerHTML = st.length ? '<div class="strip" title="Your session">'+st.map(function(x,i){
      const state = i < S.plan.index ? "past" : (i === S.plan.index && !planDone() ? "now" : "next");
      return '<span class="seg '+x.type+" "+state+'" style="flex:'+x.min+'" aria-hidden="true"></span>';
    }).join("")+'</div>' : "";
  } else if(T.mode === "pomodoro"){
    const filled = S.cycles % before === 0 && S.cycles > 0 ? before : S.cycles % before;
    let h = "";
    for(let i=0;i<before;i++){
      h += '<span style="opacity:'+(i<filled?1:.35)+'">'+ic("heart",17,i<filled?"currentColor":"none")+'</span>';
    }
    $("#hearts").innerHTML = h;
  } else { $("#hearts").innerHTML = ""; }

  // task chip
  const task = S.tasks.filter(function(t){ return t.id === S.activeTaskId; })[0];
  $("#taskChip").innerHTML = task
    ? ic("star",14,"currentColor")+'<span class="nm">'+esc(task.name)+'</span><span class="ct">'+(task.pomos||0)+"/"+task.estimate+'</span>'
    : '<span class="ct">No task selected — tap to choose</span>';

  $("#prompt").textContent = T.mode === "stopwatch" ? "Just start the clock."
    : (T.mode === "plan" && !planSteps().length) ? "How much time do you have?"
    : task ? task.name : "What do you want to focus on?";

  // controls
  let goLabel = T.running ? "Pause"
    : (leftNow() < totalMs() && T.mode !== "stopwatch" ? "Resume" : "Start");
  if(T.mode === "plan"){
    if(!planSteps().length) goLabel = "Build a plan";
    else if(planDone()) goLabel = "Run it again";
    else if(S.plan.index === 0 && leftNow() >= totalMs()) goLabel = "Start";
  }
  $("#btnGo").innerHTML = (T.running ? ic("pause",21,"currentColor") : ic("play",21,"currentColor"))+
    "<span>"+goLabel+"</span>";

  $("#hint").textContent = (T.mode === "plan" && planSteps().length && !planDone())
    ? planFocusLeft()+" min of focus left in this plan · tap Plan to change it"
    : "Space start / pause · R reset · S skip";
  $("#btnSkip").style.display = T.mode === "stopwatch" ? "none" : "grid";

  $("#streak").innerHTML = ic("flame",15,"currentColor")+streakCount();
  renderShield();
  paint();
  if(panelName) renderPanel();
  save();
}

const SETUP_SQL = [
"-- Focusstudy setup. Run once in Supabase → SQL Editor → New query.",
"",
"create table if not exists public.app_state (",
"  user_id    uuid primary key references auth.users on delete cascade,",
"  data       jsonb not null default '{}'::jsonb,",
"  updated_at timestamptz not null default now()",
");",
"alter table public.app_state enable row level security;",
"",
"create policy \"read own state\"   on public.app_state for select using (auth.uid() = user_id);",
"create policy \"insert own state\" on public.app_state for insert with check (auth.uid() = user_id);",
"create policy \"update own state\" on public.app_state for update using (auth.uid() = user_id) with check (auth.uid() = user_id);",
"create policy \"delete own state\" on public.app_state for delete using (auth.uid() = user_id);",
"",
"create table if not exists public.sessions (",
"  id        text not null,",
"  user_id   uuid not null references auth.users on delete cascade,",
"  date      date not null,",
"  type      text not null check (type in ('focus','break')),",
"  minutes   numeric(7,1) not null check (minutes >= 0),",
"  task_name text,",
"  at        timestamptz not null default now(),",
"  primary key (user_id, id)",
");",
"create index if not exists sessions_user_date on public.sessions (user_id, date);",
"alter table public.sessions enable row level security;",
"",
"create policy \"read own sessions\"   on public.sessions for select using (auth.uid() = user_id);",
"create policy \"insert own sessions\" on public.sessions for insert with check (auth.uid() = user_id);",
"create policy \"update own sessions\" on public.sessions for update using (auth.uid() = user_id) with check (auth.uid() = user_id);",

function planBuilder(){
  const f = S.planForm;
  const total0 = f.h*60 + f.m;
  // how many blocks the plan has right now (needed for the "long break after block" choices)
  let nBlocks = f.blocks;
  if(!nBlocks){
    const probe = buildPlan(Math.max(5,total0), f.includeBreaks, f.even, {blocks:0, longAt:f.longAt});
    nBlocks = probe ? probe.filter(function(x){ return x.type === "focus"; }).length : 1;
  }
  // Long break: Auto (sized to the session), Custom (tap the blocks), or None
  const cur = buildPlan(Math.max(5,total0), f.includeBreaks, f.even, {blocks:f.blocks, longAt:f.longAt});
  const curFs = focusStats(cur), curB = breakOf(cur);
  const est = S.settings.autoBreaks ? autoBreakLens(curFs.min, curFs.n ? curFs.min/curFs.n : S.settings.work)
    : {short:S.settings.short, long:S.settings.long};
  const LB = curB.long || est.long, SBm = curB.short || est.short;
  const breakToggle = '<div class="row" style="margin-top:12px"><span class="sp" style="font-size:13px">Break lengths</span>'+
    '<button class="pill" data-act="autoBreaks" aria-pressed="'+!!S.settings.autoBreaks+'" style="min-width:90px">'+
    (S.settings.autoBreaks ? "Auto" : "My lengths")+'</button></div>'+
    '<p class="note" style="margin-top:5px">'+(S.settings.autoBreaks
      ? "Sized to "+curFs.min+" min of focus: "+SBm+"-min short breaks, "+aN(LB)+"-min long break. More focus time means longer breaks."
      : "Using your Pomodoro lengths: "+S.settings.short+"-min short, "+S.settings.long+"-min long. Tap to let it size them for you.")+'</p>';
  let picks0 = longList(f.longAt);
  if(picks0){                              // drop picks that no longer exist after the plan shrank
    picks0 = sortPicks(picks0.filter(function(i){ return i === "end" || (i >= 1 && i < nBlocks); }));
    f.longAt = picks0;
  }
  const longMode = f.longAt === "none" ? "none" : (picks0 ? "custom" : "auto");
  function blockList(arr){

  if(f.blocks){
    const t = buildPlan(Math.max(5,total0), f.includeBreaks, false, {blocks:f.blocks, longAt:f.longAt});

    else { const fm = t.filter(function(x){ return x.type==="focus"; }); const lo = Math.min.apply(null, fm.map(function(x){return x.min;})), hi = Math.max.apply(null, fm.map(function(x){return x.min;}));
      blockHint = f.blocks+" focus block"+(f.blocks>1?"s":"")+" of "+(lo===hi? lo : lo+"–"+hi)+" min each, divided evenly."; }
  }
  const presets = [[0,45],[1,0],[1,30],[2,0],[3,0]].map(function(p){

  const steps = planSteps();

/* ============================ picture-in-picture ============================
   Prefers the always-on-top Document PiP window (Chrome/Edge). If the browser or the
   hosting frame won't allow it, falls back to a small popup window. The floating window
   runs its own 500ms clock so it keeps ticking while this tab is in the background. */
let pipDoc = null, pipWin = null, pipTimer = null, pipSig = "";
function pipCss(){

    ";-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}"+
    "#t{font-size:min(24vw,38vh);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:"+S.settings.spacing+"em;white-space:nowrap}"+
    "#l{font-size:max(10px,min(4.2vw,8vh));letter-spacing:.16em;text-transform:uppercase;opacity:.65;text-align:center}"+
    "#r{display:flex;gap:8px;align-items:center}"+
    "button{border:0;border-radius:999px;padding:7px 20px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:"+th.accent+";color:"+th.onAccent+"}"+
    "button.g{background:rgba(255,255,255,.16);color:"+th.text+";padding:7px 13px}"+
    "button:focus-visible{outline:2px solid "+th.text+";outline-offset:2px}";
}
function paintPip(){
  if(!pipDoc || !pipWin || pipWin.closed) return;
  try{
    const t = pipDoc.getElementById("t"), l = pipDoc.getElementById("l"), b = pipDoc.getElementById("b");
    if(!t) return;
    const sig = S.theme+"|"+S.settings.font+"|"+S.settings.spacing;      // restyle if theme/font changed
    if(sig !== pipSig){ pipSig = sig; pipDoc.getElementById("pipcss").textContent = pipCss(); }
    t.textContent = T.mode === "stopwatch" ? fmt(elapsedSw()) : fmt(leftNow());
    l.textContent = phaseLabel();
    b.textContent = T.running ? "Pause" : (T.mode !== "stopwatch" && leftNow() >= totalMs() ? "Start" : "Resume");
    pipDoc.title = (T.running ? t.textContent+" · " : "")+phaseLabel();
  }catch(e){ closePip(); }
}
function closePip(){
  if(pipTimer){ clearInterval(pipTimer); pipTimer = null; }
  const w = pipWin; pipWin = null; pipDoc = null; pipSig = "";
  try{ if(w && !w.closed) w.close(); }catch(e){}
  $("#btnPip").setAttribute("aria-pressed","false");
}
async function openPipWindow(){
  if(window.documentPictureInPicture){
    try{ return await window.documentPictureInPicture.requestWindow({width:290,height:190}); }catch(e){ /* blocked in this frame — try a popup */ }
  }
  const w = window.open("", "focusstudyTimer", "popup=yes,width=290,height=190");
  if(!w) return null;
  try{ void w.document.body; }catch(e){ try{ w.close(); }catch(_){} return null; }
  return w;
